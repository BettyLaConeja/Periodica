<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Atrapa el Elemento</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#0f172a;
    color:white;
    overflow:hidden;
}

#topBar{
    display:flex;
    justify-content:space-around;
    align-items:center;
    background:#111827;
    padding:12px;
    font-size:20px;
    font-weight:bold;
}

#mission{
    text-align:center;
    padding:10px;
    background:#1e293b;
    font-size:24px;
}

#gameArea{
    position:relative;
    width:100vw;
    height:calc(100vh - 110px);
    overflow:hidden;
    background:
    linear-gradient(
        to bottom,
        #1e3a8a,
        #0f172a
    );
}

#player{
    position:absolute;
    bottom:15px;
    width:110px;
    height:50px;
    background:#f59e0b;
    border-radius:15px;
    border:3px solid white;
    left:50%;
    transform:translateX(-50%);
}

.element{
    position:absolute;
    width:60px;
    height:60px;
    border-radius:50%;
    background:#22c55e;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:bold;
    font-size:22px;
    border:3px solid white;
}

#startScreen,
#gameOver{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.9);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:999;
}

button{
    margin-top:20px;
    padding:15px 30px;
    font-size:20px;
    cursor:pointer;
    border:none;
    border-radius:10px;
}

#gameOver{
    display:none;
}

#finalScore{
    font-size:30px;
    margin-top:20px;
}

</style>
</head>

<body>

<div id="topBar">
    <div>⭐ <span id="score">0</span></div>
    <div>❤️ <span id="lives">3</span></div>
    <div>⏱️ <span id="time">60</span></div>
</div>

<div id="mission">
    Cargando misión...
</div>

<div id="gameArea">
    <div id="player"></div>

    <div id="startScreen">
        <h1>Atrapa el Elemento</h1>
        <p style="margin-top:15px;">
            Usa ← → o A D
        </p>
        <button onclick="startGame()">
            Comenzar
        </button>
    </div>

    <div id="gameOver">
        <h1>Fin del Juego</h1>
        <div id="finalScore"></div>

        <button onclick="location.reload()">
            Jugar otra vez
        </button>
    </div>

</div>

<script>

const categories = {

"Gases Nobles":[
"He","Ne","Ar","Kr","Xe","Rn"
],

"Halógenos":[
"F","Cl","Br","I"
],

"Metales Alcalinos":[
"Li","Na","K","Rb","Cs","Fr"
],

"No Metales":[
"H","C","N","O","P","S","Se"
],

"Metaloides":[
"B","Si","Ge","As","Sb","Te"
]

};

const allElements = [
"H","He","Li","Be","B","C","N","O","F","Ne",
"Na","Mg","Al","Si","P","S","Cl","Ar",
"K","Ca","Fe","Cu","Zn","Br","Kr",
"Rb","Ag","I","Xe","Cs","Au","Rn"
];

let missionName="";
let validElements=[];

let score=0;
let lives=3;
let timeLeft=60;

const player=document.getElementById("player");
const gameArea=document.getElementById("gameArea");

let playerX=window.innerWidth/2;

let keys={};

document.addEventListener("keydown",e=>{
    keys[e.key.toLowerCase()]=true;
});

document.addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()]=false;
});

function speak(text){

    if(!window.speechSynthesis) return;

    let utter=
    new SpeechSynthesisUtterance(text);

    utter.lang="es-ES";

    speechSynthesis.speak(utter);
}

function chooseMission(){

    const names=
    Object.keys(categories);

    missionName=
    names[
        Math.floor(
            Math.random()*names.length
        )
    ];

    validElements=
    categories[missionName];

    document.getElementById("mission")
    .textContent=
    "Atrapa solamente: "
    + missionName;

    speak(
    "Atrapa solamente "
    + missionName
    );
}

function startGame(){

    document.getElementById("startScreen")
    .style.display="none";

    chooseMission();

    setInterval(updatePlayer,16);
    setInterval(createElement,900);
    setInterval(updateElements,20);

    startTimer();
}

function updatePlayer(){

    if(keys["arrowleft"] || keys["a"])
        playerX-=8;

    if(keys["arrowright"] || keys["d"])
        playerX+=8;

    if(playerX<0)
        playerX=0;

    if(playerX>
       window.innerWidth-110)
        playerX=
        window.innerWidth-110;

    player.style.left=
    playerX+"px";
}

let falling=[];

function createElement(){

    if(timeLeft<=0) return;

    const div=
    document.createElement("div");

    div.className="element";

    const symbol=
    allElements[
    Math.floor(
    Math.random()*allElements.length
    )];

    div.textContent=symbol;

    div.style.left=
    Math.random()*
    (window.innerWidth-70)
    +"px";

    div.style.top="-60px";

    gameArea.appendChild(div);

    falling.push({
        el:div,
        symbol:symbol,
        y:-60
    });
}

function updateElements(){

    for(let i=falling.length-1;i>=0;i--){

        let item=falling[i];

        item.y+=3;

        item.el.style.top=
        item.y+"px";

        const rect=
        item.el.getBoundingClientRect();

        const playerRect=
        player.getBoundingClientRect();

        const collision=
        rect.bottom>=playerRect.top &&
        rect.left<playerRect.right &&
        rect.right>playerRect.left;

        if(collision){

            if(
            validElements.includes(
            item.symbol
            )){

                score+=10;

                speak("Correcto");

            }else{

                score-=10;

                lives--;

                speak("Incorrecto");
            }

            updateHUD();

            item.el.remove();
            falling.splice(i,1);

            continue;
        }

        if(item.y>window.innerHeight){

            if(
            validElements.includes(
            item.symbol
            )){

                score-=5;
            }

            item.el.remove();
            falling.splice(i,1);

            updateHUD();
        }
    }

    if(lives<=0){

        finishGame();
    }
}

function updateHUD(){

    document.getElementById("score")
    .textContent=score;

    document.getElementById("lives")
    .textContent=lives;
}

function startTimer(){

    const timer=
    setInterval(()=>{

        timeLeft--;

        document.getElementById("time")
        .textContent=timeLeft;

        if(timeLeft<=0){

            clearInterval(timer);

            finishGame();
        }

    },1000);
}

function finishGame(){

    document.getElementById("gameOver")
    .style.display="flex";

    document.getElementById("finalScore")
    .innerHTML=
    "Puntaje final: <br><br>"
    + score;

    speak(
    "Fin del juego. Puntaje "
    + score
    );
}

</script>

</body>
</html>
