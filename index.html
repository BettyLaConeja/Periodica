<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atrapa el Elemento</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#0f172a;color:#fff;overflow:hidden}
#hud{display:flex;justify-content:space-around;padding:10px;background:#111827;font-weight:bold}
#mission{text-align:center;padding:8px;background:#1e293b}
#game{position:relative;height:calc(100vh - 84px);overflow:hidden}
#basket{position:absolute;bottom:20px;width:110px;height:45px;border-radius:12px;background:#f59e0b}
.element{position:absolute;width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#22c55e;font-weight:bold;border:2px solid white}
#overlay{position:absolute;inset:0;background:rgba(0,0,0,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
button{padding:12px 24px;font-size:18px}
</style>
</head>
<body>
<div id="hud">
<div>⭐ <span id="score">0</span></div>
<div>❤️ <span id="lives">3</span></div>
<div>⏱️ <span id="time">60</span></div>
</div>
<div id="mission"></div>
<div id="game">
<div id="basket"></div>
<div id="overlay">
<h1>Atrapa el Elemento</h1>
<p>Arrastra el dedo para mover la cesta.</p>
<button onclick="startGame()">Comenzar</button>
</div>
</div>
<script>
const categories={
"Gases Nobles":["He","Ne","Ar","Kr","Xe","Rn","Og"],
"Halógenos":["F","Cl","Br","I","At","Ts"],
"Alcalinos":["Li","Na","K","Rb","Cs","Fr"],
"No Metales":["H","C","N","O","P","S","Se"]
};
const all=[...new Set(Object.values(categories).flat().concat(
["Be","Mg","Ca","Fe","Cu","Zn","Ag","Au","Al","Si"]))];
let mission="",valid=[],score=0,lives=3,time=60,objs=[];
const game=document.getElementById("game");
const basket=document.getElementById("basket");
let bx=window.innerWidth/2-55;

function chooseMission(){
 const keys=Object.keys(categories);
 mission=keys[Math.floor(Math.random()*keys.length)];
 valid=categories[mission];
 document.getElementById("mission").textContent="Atrapa solamente: "+mission;
}
function startGame(){
 document.getElementById("overlay").style.display="none";
 chooseMission();
 setInterval(spawn,900);
 setInterval(update,20);
 setInterval(()=>{
   time--;
   timeEl.textContent=time;
   if(time<=0) endGame();
 },1000);
}
function spawn(){
 const d=document.createElement("div");
 d.className="element";
 const sym=all[Math.floor(Math.random()*all.length)];
 d.textContent=sym;
 const x=Math.random()*(window.innerWidth-60);
 d.style.left=x+"px";
 d.style.top="-60px";
 game.appendChild(d);
 objs.push({el:d,sym:sym,y:-60,x:x});
}
function update(){
 basket.style.left=bx+"px";
 for(let i=objs.length-1;i>=0;i--){
  const o=objs[i];
  o.y+=3;
  o.el.style.top=o.y+"px";
  const r=o.el.getBoundingClientRect();
  const b=basket.getBoundingClientRect();
  if(r.bottom>=b.top && r.left<b.right && r.right>b.left){
    if(valid.includes(o.sym)) score+=10; else {score-=10;lives--;}
    removeObj(i);
  } else if(o.y>window.innerHeight){
    if(valid.includes(o.sym)) score-=5;
    removeObj(i);
  }
 }
 scoreEl.textContent=score;
 livesEl.textContent=lives;
 if(lives<=0) endGame();
}
function removeObj(i){objs[i].el.remove();objs.splice(i,1);}
function endGame(){
 localStorage.setItem("tabla_periodica_mejor",Math.max(score,+(localStorage.getItem("tabla_periodica_mejor")||0)));
 document.getElementById("overlay").style.display="flex";
 document.getElementById("overlay").innerHTML=`<h1>Fin del juego</h1><p>Puntaje: ${score}</p><p>Récord: ${localStorage.getItem("tabla_periodica_mejor")}</p><button onclick="location.reload()">Jugar otra vez</button>`;
}
const scoreEl=document.getElementById("score");
const livesEl=document.getElementById("lives");
const timeEl=document.getElementById("time");

game.addEventListener("touchmove",e=>{
 e.preventDefault();
 bx=e.touches[0].clientX-55;
},{passive:false});

game.addEventListener("mousemove",e=>{
 if(e.buttons===1) bx=e.clientX-55;
});
</script>
</body>
</html>
